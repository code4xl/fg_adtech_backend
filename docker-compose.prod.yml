services:
  api:
    container_name: nestjs_api_prod
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        - NODE_ENV=production
    volumes:
      - ../OceanAdTechSDK/dist:/usr/src/sdk-project/dist:ro
    ports:
      - '3001:3001'
    env_file:
      - .env.production
    environment:
      - SDK_BUILD_PATH=/usr/src/sdk-project/dist/ocean-ads.min.js
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
      timescaledb:
        condition: service_started
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka_prod
    ports:
      - '9092:9092'
    environment:
      - TZ=Asia/Kolkata
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:29093
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://kafka:29093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - app-network
    restart: always
    healthcheck:
      test: nc -z localhost 9092 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M

  # redis:
  #   image: redis/redis-stack:latest
  #   container_name: redis_prod
  #   ports:
  #     - '6379:6379'
  #   environment:
  #     - TZ=Asia/Kolkata
  #     - REDIS_ARGS=--requirepass ${REDIS_PASSWORD}
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - app-network
  #   restart: always
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: '0.5'
  #         memory: 512M

  redis:
    image: redis/redis-stack:latest
    container_name: redis_prod
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - '6379:6379'
    environment:
      - TZ=Asia/Kolkata
    volumes:
      - redis-data:/data
    networks:
      - app-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: timescaledb_prod
    ports:
      - '5433:5432'
    environment:
      - TZ=Asia/Kolkata
      - PGTZ=Asia/Kolkata
      - POSTGRES_DB=${TIMESCALEDB_DATABASE}
      - POSTGRES_USER=${TIMESCALEDB_USER}
      - POSTGRES_PASSWORD=${TIMESCALEDB_PASSWORD}
      - POSTGRES_HOST_AUTH_METHOD=md5
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M

networks:
  app-network:
    driver: bridge

volumes:
  kafka-data:
  redis-data:
  timescaledb-data: