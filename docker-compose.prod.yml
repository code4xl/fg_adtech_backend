services:
  api:
    container_name: nestjs_api_prod
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        - NODE_ENV=production
    ports:
      - '${PORT}:${PORT}'
    env_file:
      - .env.production
    restart: always
    depends_on:
      - redis
      - kafka
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: zookeeper_prod
    ports:
      - '2181:2181'
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    volumes:
      - zookeeper-data:/bitnami/zookeeper
    networks:
      - app-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

  kafka:
    image: bitnami/kafka:latest
    container_name: kafka_prod
    ports:
      - '9092:9092'
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka-data:/bitnami/kafka
    depends_on:
      - zookeeper
    networks:
      - app-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis/redis-stack:latest
    container_name: redis_prod
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - app-network
    restart: always
    environment:
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

networks:
  app-network:
    driver: bridge

volumes:
  zookeeper-data:
  kafka-data:
  redis-data:
