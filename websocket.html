<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <h2>WebSocket Connection Test</h2>
    <div>
        <input type="text" id="tokenInput" placeholder="Your JWT token" style="width: 500px;">
        <button onclick="connect()">Connect</button>
        <button onclick="disconnect()">Disconnect</button>
    </div>
    <div>
        <button onclick="getUnreadCount()">Get Unread Count</button>
        <button onclick="markAllAsRead()">Mark All As Read</button>
    </div>
    <pre id="output" style="margin-top: 20px; padding: 10px; background-color: #f5f5f5; height: 300px; overflow-y: auto;"></pre>

    <script>
        let socket;

        function log(message) {
            const output = document.getElementById('output');
            output.textContent += new Date().toLocaleTimeString() + ': ' + message + '\n';
            output.scrollTop = output.scrollHeight;
        }

        function connect() {
            const token = document.getElementById('tokenInput').value;
            if (!token) {
                alert('Please enter a token');
                return;
            }

            log('Connecting...');
            
            // THIS IS THE CORRECT CONNECTION METHOD FOR YOUR SERVER
            socket = io('https://ec2-13-202-24-106.ap-south-1.compute.amazonaws.com/notifications', {
                auth: { token: token },
                transports: ['websocket']
            });

            socket.on('connect', () => {
                log('Connected successfully!');
            });

            socket.on('connect_error', (error) => {
                log('Connection error: ' + error.message);
            });

            socket.on('notification', (data) => {
                log('Received notification: ' + JSON.stringify(data));
            });

            socket.on('broadcast', (data) => {
                log('Received broadcast: ' + JSON.stringify(data));
            });

            socket.on('historical_broadcasts', (data) => {
                log('Received historical broadcasts: ' + JSON.stringify(data));
            });

            socket.on('disconnect', (reason) => {
                log('Disconnected: ' + reason);
            });
        }

        function disconnect() {
            if (socket) {
                socket.disconnect();
                log('Disconnected by user');
            }
        }

        function getUnreadCount() {
            if (!socket || !socket.connected) {
                log('Not connected');
                return;
            }
            log('Requesting unread count...');
            socket.emit('getUnreadCount', {}, (response) => {
                log('Unread count response: ' + JSON.stringify(response));
            });
        }

        function markAllAsRead() {
            if (!socket || !socket.connected) {
                log('Not connected');
                return;
            }
            log('Marking all as read...');
            socket.emit('markAllAsRead', {}, (response) => {
                log('Mark all read response: ' + JSON.stringify(response));
            });
        }
    </script>
</body>
</html>
