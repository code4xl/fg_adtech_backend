services:
  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    ports:
      - '9092:9092' # External/client communication
      - '9093:9093' # Internal controller communication
    environment:
      # KRaft mode configuration
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093

      # Fixed listeners configuration
      - KAFKA_CFG_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER

      # Inter-broker communication
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT

      # Other settings
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes

      # For development only
      - KAFKA_KRAFT_CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/bitnami/kafka
    networks:
      - app-network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1',
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Keep the management tools for development
  kafdrop:
    image: obsidiandynamics/kafdrop
    container_name: kafdrop
    ports:
      - '9000:9000'
    environment:
      - KAFKA_BROKERCONNECT=kafka:9092
      - JVM_OPTS=-Xms32M -Xmx64M
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - app-network

  redis:
    image: redis/redis-stack:latest
    container_name: redis
    ports:
      - '6379:6379'
      - '8001:8001'
    networks:
      - app-network
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: timescaledb
    ports:
      - '5433:5432' # Different port to avoid conflict with main PostgreSQL
    environment:
      - POSTGRES_DB=rtb_timeseries
      - POSTGRES_USER=timescale_user
      - POSTGRES_PASSWORD=timescale_pass
      - POSTGRES_HOST_AUTH_METHOD=md5
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./timescaledb/init:/docker-entrypoint-initdb.d/ # Initialization scripts
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U timescale_user -d rtb_timeseries']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    container_name: nestjs_api_dev
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    env_file:
      - .env.development
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  redis-data:
  kafka-data:
  timescaledb-data:
